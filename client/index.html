<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>MadeByKseniya | סטודיו ציפורניים</title>
    <meta name="description" content="MadeByKseniya — סטודיו ציפורניים פרימיום. מניקור ג'ל, בניה, פדיקור ועיצובים. קביעת תור אונליין." />
    <script id="mbk-theme-boot">
      (function () {
        var KEY = "mbk-theme";
        var NAMES = ["--oled-950", "--oled-900", "--oled-850", "--oled-800", "--oled-700", "--oled-600", "--theme-fg", "--theme-fg-soft", "--theme-line", "--theme-border", "--theme-scheme", "--ink-violet-100", "--ink-violet-200", "--ink-violet-300", "--ink-red-300", "--ink-rose-300", "--ink-amber-200", "--ink-amber-300", "--ink-emerald-200", "--ink-emerald-300", "--ink-emerald-400", "--theme-violet-gradient"];
        var CH = /^\d{1,3} \d{1,3} \d{1,3}$/;
        var RGBA = /^rgba\(\d{1,3}, \d{1,3}, \d{1,3}, (0(\.\d{1,3})?|1)\)$/;
        var FACTOR = /^[0-2](\.\d{1,3})?$/;
        var SCHEME = /^(normal|light|dark)$/;
        var GRADIENT = /^linear-gradient\(135deg(, #[0-9a-f]{6} \d{1,3}%){4}\)$/;
        function safe(n, v) {
          if (typeof v !== "string") return false;
          if (n.indexOf("--oled-") === 0 || n.indexOf("--ink-") === 0 || n === "--theme-fg") return CH.test(v);
          if (n === "--theme-fg-soft" || n === "--theme-line") return FACTOR.test(v);
          if (n === "--theme-border") return RGBA.test(v);
          if (n === "--theme-scheme") return SCHEME.test(v);
          if (n === "--theme-violet-gradient") return GRADIENT.test(v);
          return false;
        }
        try {
          var raw = localStorage.getItem(KEY);
          if (!raw) return;
          var d = JSON.parse(raw);
          var ok = d && d.v === 3 && /^#[0-9a-f]{6}$/.test(d.c) && /^#[0-9a-f]{6}$/.test(d.m) && d.vars;
          for (var i = 0; ok && i < NAMES.length; i++) ok = safe(NAMES[i], d.vars[NAMES[i]]);
          if (!ok) {
            localStorage.removeItem(KEY);
            return;
          }
          var root = document.documentElement;
          for (var j = 0; j < NAMES.length; j++) root.style.setProperty(NAMES[j], d.vars[NAMES[j]]);
          root.setAttribute("data-theme", "custom");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", d.m);
        } catch (e) {
          try {
            localStorage.removeItem(KEY);
          } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body class="bg-oled-950 text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
